*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 22px/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:600 15px/1.2 var(--display);margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--board);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger)}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:2px}
select,input,textarea{background:var(--board);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;min-height:32px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);min-width:0}
label>input,label>select,label>textarea{width:100%;color:var(--ink);font-size:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.top .sub{color:var(--ink2);font-size:13px}
.grow{flex:1 1 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line2);background:var(--board)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--board);font-weight:600}
.inline{flex-direction:row;align-items:center;gap:6px;font-size:13px}
.inline select{width:auto;max-width:190px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:10px;font-size:12px;color:var(--ink2)}
.legend span.k{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid var(--line2)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr)}

.scroll{overflow-x:auto;background:var(--board);border:1px solid var(--line);border-radius:8px}
.board{display:grid;min-width:780px}

.cell.over{background:var(--hover);box-shadow:inset 0 0 0 2px var(--accent)}

.card[draggable="true"]{cursor:grab}
.card:hover{filter:brightness(.97)}
.card.clash{border:2px solid var(--danger)}
.card.check{border:2px dashed var(--warn)}
.card.hl{box-shadow:0 0 0 3px var(--accent)}
.card .l1{display:flex;justify-content:space-between;gap:6px;align-items:baseline}

.cr{font:400 11px var(--mono)}

.who{font-weight:600}
.alert{font-weight:700}

.load .off{color:var(--danger)}.load .on{color:var(--ok)}

.raw{font:12px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.err{color:var(--danger);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.insrow{border-top:1px solid var(--line);padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal{display:grid;min-width:780px}
.wk{padding:6px 8px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--ink2)}

mat":"Hybrid","half":null,"id":"i18","instructor":"natalie","note":"","pattern":"weekly","sec":"02","sem":"spring","start":"18:00","title":"DBDM 2"},{"cap":null,"code":"MHS 589","cohort":"y1","credits":3,"dates":[],"day":"Wed","end":"19:30","format":"","half":null,"id":"i17","instructor":"pt","note":"","pattern":"A","sec":"01","sem":"spring","start":"17:00","title":"Psych Int 1"},{"cap":null,"code":"MHS 589","cohort":"y1","credits":3,"dates":[],"day":"Wed","end":"19:30","format":"","half":null,"id":"h18","instructor":"pt","note":"","pattern":"B","sec":"02","sem":"spring","start":"17:00","title":"Psych Int 1"},{"cap":null,"code":"MHS 510","cohort":"y1","credits":3,"dates":[],"day":null,"end":null,"format":"Online Async","half":null,"id":"j17","instructor":"pt","note":"","pattern":"unset","sec":"","sem":"spring","start":null,"title":"Schools as Sys"},{"cap":null,"code":"MHS 538","cohort":"y1","credits":3,"dates":[],"day":null,"end":null,"format":"Online Async","half":null,"id":"j18","instructor":"casey","note":"","pattern":"unset","sec":"","sem":"spring","start":null,"title":"Dev. Psychopathology"}],"semesters":{"fall":{"end":"2027-12-12","label":"Fall 2027","noClass":["2027-09-06","2027-11-24","2027-11-25","2027-11-26","2027-11-27","2027-11-28"],"start":"2027-08-24"},"spring":{"end":"2028-05-14","label":"Spring 2028","noClass":["2028-02-18","2028-02-19","2028-02-20","2028-02-21","2028-03-13","2028-03-14","2028-03-15","2028-03-16","2028-03-17","2028-03-18","2028-03-19","2028-04-14","2028-04-15","2028-04-16"],"start":"2028-01-19"}}},"publishedAt":"2026-11-04T20:04:46.597Z"};</script><script>/* Schedule logic: meeting dates, conflicts, loads. Pure functions, no DOM. */
const DOW = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
const iso = d => d.toISOString().slice(0, 10);
const parseD = s => new Date(s + 'T00:00:00Z');
const addDays = (d, n) => new Date(d.getTime() + n * 864e5);

/* A/B labels alternate per weekday by meeting, counted from the semester's first
   calendar week. A skipped no-class date doesn't advance the alternation; a weekday
   that falls before the first class day in week one uses up the A slot. */
function weekdayDates(sem, day) {
  const start = parseD(sem.start), end = parseD(sem.end), off = new Set(sem.noClass || []);
  const monday = addDays(start, -((start.getUTCDay() + 6) % 7));
  let d = addDays(monday, (DOW[day] + 6) % 7), idx = 0;
  const out = [];
  for (; d <= end; d = addDays(d, 7)) {
    const s = iso(d);
    if (off.has(s)) continue;
    if (d >= start) out.push({ date: s, wk: idx % 2 === 0 ? 'A' : 'B' });
    idx++;
  }
  return out;
}

/* Returns the array of ISO dates a section meets, or null if not yet known. */
function meetingDates(sec, sem) {
  if (sec.pattern === 'custom') return sec.dates && sec.dates.length ? sec.dates.slice().sort() : null;
  if (!sec.day) return null;
  const all = weekdayDates(sem, sec.day);
  switch (sec.pattern) {
    case 'weekly': return all.map(x => x.date);
    case 'A': case 'B': return all.filter(x => x.wk === sec.pattern).map(x => x.date);
    case 'eight':
      const mid = Math.ceil(all.length / 2);
      if (sec.half === 'first') return all.slice(0, mid).map(x => x.date);
      if (sec.half === 'second') return all.slice(mid).map(x => x.date);
      return null;
    default: return null;
  }
}

const mins = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };

/* 'clash' = certain overlap; 'check' = could overlap, details missing; null = clear. */
function overlap(a, b, semesters) {
  if (a.sem !== b.sem) return null;
  const sem = semesters[a.sem];
  const da = meetingDates(a, sem), db = meetingDates(b, sem);
  const sa = mins(a.start), ea = mins(a.end), sb = mins(b.start), eb = mins(b.end);
  const timesKnown = sa != null && ea != null && sb != null && eb != null;
  const timesHit = timesKnown && sa < eb && sb < ea;
  if (timesKnown && !timesHit) return null;
  if (da && db) {
    const set = new Set(da);
    if (!db.some(x => set.has(x))) return null;
    return timesKnown ? 'clash' : 'check';
  }
  // Dates aren't fully known: fall back to the day/time rule.
  const dayOf = x => (x.pattern === 'custom' ? null : x.day);
  const dayA = dayOf(a), dayB = dayOf(b);
  if (!dayA && a.pattern !== 'custom') return null;
  if (!dayB && b.pattern !== 'custom') return null;
  if (dayA && dayB && dayA !== dayB) return null;
  if (!timesKnown) return 'check';
  // A pending 8-week split or an async course may not really collide, so ask rather than assert.
  const soft = x => x.pattern === 'eight' || x.pattern === 'custom' || /async/i.test(x.format || '');
  return soft(a) || soft(b) ? 'check' : 'clash';
}

const label = s => s.code.replace('MHS ', '') + (s.sec ? '-' + s.sec : '');
const fullLabel = s => s.code + (s.sec ? '-' + s.sec : '');

function analyze(state, semKey) {
  const secs = state.sections.filter(s => s.sem === semKey);
  const issues = [];
  const add = (level, kind, text, ids) => issues.push({ level, kind, text, ids });
  const byId = Object.fromEntries(state.instructors.map(i => [i.id, i]));

  // Instructors. Placeholder rows stand for several people, so they aren't compared.
  for (let i = 0; i < secs.length; i++) for (let j = i + 1; j < secs.length; j++) {
    const a = secs[i], b = secs[j];
    if (a.instructor !== b.instructor) continue;
    const ins = byId[a.instructor];
    if (!ins || ins.kind === 'placeholder') continue;
    const o = overlap(a, b, state.semesters);
    if (o) add(o, 'Instructor', `${ins.short}: ${fullLabel(a)} and ${fullLabel(b)} ${o === 'clash' ? 'overlap' : 'may overlap; a time or date is missing'}`, [a.id, b.id]);
  }

  // Cohorts. A student takes one section of each course, so ask whether a working path exists.
  for (const co of state.cohorts) {
    const cs = secs.filter(s => s.cohort === co.id);
    const courses = {};
    cs.forEach(s => (courses[s.code] = courses[s.code] || []).push(s));
    const codes = Object.keys(courses);
    const hit = new Map();
    const ov = (a, b) => { const k = a.id < b.id ? a.id + b.id : b.id + a.id; if (!hit.has(k)) hit.set(k, overlap(a, b, state.semesters)); return hit.get(k); };
    const reachable = new Set(); let paths = 0;
    (function walk(i, chosen) {
      if (paths > 20000) return;
      if (i === codes.length) { paths++; chosen.forEach(s => reachable.add(s.id)); return; }
      for (const s of courses[codes[i]]) if (!chosen.some(c => ov(c, s) === 'clash')) walk(i + 1, chosen.concat(s));
    })(0, []);
    for (let i = 0; i < codes.length; i++) for (let j = i + 1; j < codes.length; j++) {
      const A = courses[codes[i]], B = courses[codes[j]];
      const res = A.flatMap(a => B.map(b => ov(a, b)));
      const ids = [...A, ...B].map(s => s.id);
      if (res.every(r => r === 'clash')) add('clash', 'Cohort', `${co.label}: every section of ${codes[i]} overlaps every section of ${codes[j]}`, ids);
      else if (res.every(r => r)) add('check', 'Cohort', `${co.label}: ${codes[i]} and ${codes[j]} may overlap for everyone; a time or date is missing`, ids);
    }
    if (codes.length && paths > 0) cs.filter(s => !reachable.has(s.id)).forEach(s => add('clash', 'Cohort', `${co.label}: a student in ${fullLabel(s)} can't fit one section of every other course`, [s.id]));
    for (const code of codes) {
      const caps = courses[code].map(s => s.cap);
      if (caps.every(c => c != null)) {
        const total = caps.reduce((x, y) => x + y, 0);
        if (total < co.size) add('check', 'Capacity', `${code}: ${total} seats for ${co.size} ${co.label}`, courses[code].map(s => s.id));
      }
    }
  }

  // Loads
  const loads = state.instructors.map(ins => {
    const mine = secs.filter(s => s.instructor === ins.id);
    return { ins, credits: mine.reduce((t, s) => t + (s.credits || 0), 0), missing: mine.filter(s => s.credits == null).length, sections: mine };
  });
  for (const l of loads) if (l.ins.target != null && l.credits !== l.ins.target) {
    const d = l.credits - l.ins.target;
    add('load', 'Load', `${l.ins.short}: ${l.credits} of ${l.ins.target} credits (${d > 0 ? d + ' over' : -d + ' under'})`, l.sections.map(s => s.id));
  }
  return { issues, loads };
}

function head(st){

}
function legend(st){

function statusMap(st){const m={};if(!editing())return m;analyze(st,ui.sem).issues.forEach(i=>{if(i.level==='load'||i.kind==='Capacity')return;i.ids.forEach(id=>{if(i.level==='clash')m[id]='clash';else if(!m[id])m[id]='check'})});return m}
function card(st,s,m){
  const c=colorOf(st,s),status=m[s.id]||'',q=editing()&&(s.flags||[]).length;
  return`<div class="card ${status} ${ui.hl.includes(s.id)?'hl':''}" role="button" tabindex="0" data-sec="${esc(s.id)}" ${editing()?'draggable="true"':''} style="${paint(c)}">
  <div class="l1"><span class="code">${esc(label(s))}</span><span class="cr">${s.credits==null?'? cr':s.credits+' cr'}</span></div>
  <div class="ttl">${esc(s.title)}</div><div class="mt">${esc(fmtRange(s))} · ${esc(patText(s))}</div><div class="who">${esc(insOf(st,s.instructor).short)}</div>
  ${status==='clash'?'<div class="alert">Overlap</div>':status==='check'?'<div class="alert">Check</div>':''}${q?`<span class="sr">Has a workbook question</span>`:''}</div>`}
function board(st){
  const vis=visible(st),m=statusMap(st);
  const used=d=>st.sections.some(s=>s.sem===ui.sem&&s.day===d);
  const days=DAYS.filter(d=>['Mon','Tue','Wed','Thu'].includes(d)||used(d));
  const parking=editing()||vis.some(s=>!s.day);
  const cols=days.length+(parking?1:0);
  let h=`<div class="scroll"><div class="board" style="grid-template-columns:82px repeat(${cols},minmax(136px,1fr))"><div class="ch"><span class="sr">Cohort</span></div>${days.map(d=>`<div class="ch">${DAYNAME[d]}</div>`).join('')}${parking?'<div class="ch">No day set</div>':''}`;
  st.cohorts.filter(c=>!ui.fc||c.id===ui.fc).forEach(c=>{
    h+=`<div class="rh">${esc(c.label)}<small>${c.size} students</small></div>`;
    days.forEach(d=>{h+=`<div class="cell" data-cohort="${c.id}" data-day="${d}">${vis.filter(s=>s.cohort===c.id&&s.day===d).sort(byTime).map(s=>card(st,s,m)).join('')}</div>`});
    if(parking)h+=`<div class="cell parking" data-cohort="${c.id}" data-day="">${vis.filter(s=>s.cohort===c.id&&!s.day).map(s=>card(st,s,m)).join('')}</div>`;
  });
  return h+'</div></div>'}
const byTime=(a,b)=>(a.start||'99').localeCompare(b.start||'99')||a.code.localeCompare(b.code)||a.sec.localeCompare(b.sec);

function calendar(st){
  const sem=st.semesters[ui.sem],vis=visible(st);
  const map={},unset=[];
  vis.forEach(s=>{const ds=meetingDates(s,sem);if(!ds)unset.push(s);else ds.forEach(d=>(map[d]=map[d]||[]).push(s))});
  const days=DAYS.filter(d=>['Mon','Tue','Wed','Thu'].includes(d)||vis.some(s=>s.day===d));
  const st0=new Date(sem.start+'T00:00:00Z'),end=new Date(sem.end+'T00:00:00Z'),off=new Set(sem.noClass||[]);
  let mon=new Date(st0.getTime()-((st0.getUTCDay()+6)%7)*864e5);
  const chip=s=>`<button class="chip" data-sec="${esc(s.id)}" style="${paint(colorOf(st,s))}" title="${esc(s.title+' · '+insOf(st,s.instructor).name+' · '+fmtRange(s))}">${esc(label(s))}</button>`;
  let h='';
  if(unset.length)h+=`<div class="panel" style="margin-bottom:10px"><h2>Dates not set yet</h2><div class="chips">${unset.sort(byTime).map(chip).join('')}</div><p class="muted" style="margin:6px 0 0">The workbook doesn't give a meeting pattern for these sections, so they aren't on the calendar below.</p></div>`;
  h+=`<div class="scroll"><div class="cal" style="grid-template-columns:82px repeat(${days.length},minmax(130px,1fr))"><div class="ch">Week of</div>${days.map(d=>`<div class="ch">${DAYNAME[d]}</div>`).join('')}`;
  for(;mon<=end;mon=new Date(mon.getTime()+7*864e5)){
    h+=`<div class="wk">${fmtD(mon.toISOString().slice(0,10))}</div>`;
    days.forEach(d=>{const dt=new Date(mon.getTime()+DAYS.indexOf(d)*864e5),s=dt.toISOString().slice(0,10),out=dt<st0||dt>end,isOff=off.has(s);
      const list=(map[s]||[]).slice().sort(byTime);
      h+=`<div class="dc ${isOff?'off':''} ${out?'out':''}"><span class="d">${fmtD(s)}${isOff?' · no classes':''}</span>${list.map(chip).join('')}</div>`});
  }
  return h+'</div></div>'}

function side(st){
  const a=analyze(st,ui.sem),cl=a.issues.filter(i=>i.level==='clash'),ch=a.issues.filter(i=>i.level==='check');

function loadView(){

function renderStatus(){

function wire(){
  root.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>{ui[b.dataset.ui]=b.dataset.v;renderMain();if(ui.drawer==='section'&&b.dataset.ui==='sem')closeDrawer()});

  const pl=$('#plan');if(pl)pl.onchange=()=>switchPlan(pl.value);

  root.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{ui.hl=b.dataset.issue.split(',');renderMain();clearTimeout(wire.t);wire.t=setTimeout(()=>{ui.hl=[];renderMain()},2600)});

function moveSection(id,cohort,day){
  const s=state.sections.find(x=>x.id===id);if(!s)return;
  if(s.cohort!==cohort){toast('Sections stay in their cohort when dragged. Change the cohort in the section details.');return}
  if(s.day===day)return;
  commit(st=>{st.sections.find(x=>x.id===id).day=day},{drawer:ui.sel===id});
  const after=analyze(state,ui.sem).issues.filter(i=>i.ids.includes(id)&&i.level==='clash');
  toast(`${fullLabel(s)} moved to ${day?DAYNAME[day]:'No day set'}.${after.length?' It now overlaps; see the Overlaps list.':''}`);
}
function act(a){
  if(a==='undo')step(undo,redo);else if(a==='redo')step(redo,undo);
  else if(a==='settings'){ui.drawer='settings';renderDrawer()}
  else if(a==='plans'){ui.drawer='plans';ui.confirm=null;renderDrawer()}
  else if(a==='publish'){ui.drawer='publish';renderDrawer()}

function openSection(id){ui.sel=id;ui.drawer='section';ui.confirm=null;renderDrawer()}
function closeDrawer(){ui.drawer=null;ui.sel=null;drawerEl.hidden=true;drawerEl.innerHTML=''}
function closeBtn(){return`<button data-close aria-label="Close panel">Close</button>`}

function parseDates(txt,sem){
  const yr=+sem.start.slice(0,4),out=[],bad=[];
  txt.split(/[,\s]+/).filter(Boolean).forEach(t=>{const m=t.match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m){bad.push(t);return}const s=`${yr}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    if(isNaN(new Date(s+'T00:00:00Z'))||s<sem.start||s>sem.end)bad.push(t);else out.push(s)});
  return{out:[...new Set(out)].sort(),bad}}
const toMD=s=>{const[,m,d]=s.split('-').map(Number);return m+'/'+d};

  if(!ui.drawer){drawerEl.hidden=true;return}
  drawerEl.hidden=false;
  if(ui.drawer==='section')sectionDrawer();else if(ui.drawer==='settings')settingsDrawer();else if(ui.drawer==='plans')plansDrawer();else publishDrawer();

  <h2>Instructors</h2><p class="muted" style="margin:0">Add part-time faculty by name here, then assign them in a section. People with no target aren't checked against a load.</p>
  ${st.instructors.map(i=>{const used=st.sections.some(s=>s.instructor===i.id);return`<div class="insrow" data-ins="${esc(i.id)}"><label>Name<input data-f="name" value="${esc(i.name)}"></label><label>Short name on cards<input data-f="short" value="${esc(i.short)}"></label>
  <label>Credit target per semester<input data-f="target" type="number" min="0" value="${i.target==null?'':i.target}"></label><label>Color<select data-f="color">${COLORS.map(c=>`<option ${i.color===c?'selected':''}>${c}</option>`).join('')}</select></label>
  ${i.kind==='placeholder'?'<span class="muted" style="grid-column:1/-1">Stands in for several people, so overlaps are not checked.</span>':''}${used?'':`<button class="danger" data-rm="${esc(i.id)}" style="grid-column:1/-1">Remove ${esc(i.short)}</button>`}</div>`}).join('')}
  <button id="add-ins">Add instructor</button>${semBlock('fall')}${semBlock('spring')}
  <p class="muted" style="margin:0">A and B weeks recalculate from these dates.</p>
  <h2>Cohort sizes</h2><div class="g2">${st.cohorts.map(c=>`<label>${esc(c.label)}<input type="number" min="0" data-co="${c.id}" value="${c.size}"></label>`).join('')}</div>`;
  drawerEl.querySelectorAll('[data-ins] [data-f]').forEach(e=>e.onchange=()=>{const id=e.closest('[data-ins]').dataset.ins,f=e.dataset.f;let v=e.value;if(f==='target')v=v===''?null:Number(v);commit(st=>{const i=st.instructors.find(x=>x.id===id);i[f]=v;if(i.kind==='placeholder'&&f==='name')i.kind='placeholder'})});
  drawerEl.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>commit(st=>{st.instructors=st.instructors.filter(i=>i.id!==b.dataset.rm)},{drawer:true}));
  $('#add-ins').onclick=()=>commit(st=>st.instructors.push({id:'i'+Date.now().toString(36),name:'New instructor',short:'New',kind:'named',color:'orange',target:null}),{drawer:true});
  drawerEl.querySelectorAll('[data-co]').forEach(e=>e.onchange=()=>commit(st=>{st.cohorts.find(c=>c.id===e.dataset.co).size=Number(e.value)||0}));
  drawerEl.querySelectorAll('[data-sem]').forEach(e=>e.onchange=()=>{const k=e.dataset.sem,f=e.dataset.f;
    if(f==='noClass'){const m=state.semesters[k],{out,bad}=parseDates(e.value,{start:m.start.slice(0,4)+'-01-01',end:m.start.slice(0,4)+'-12-31'});drawerEl.querySelector(`[data-err=${k}]`).textContent=bad.length?`Couldn't read: ${bad.join(', ')}`:'';commit(st=>{st.semesters[k].noClass=out})}
    else if(e.value)commit(st=>{st.semesters[k][f]=e.value})});
}
function plansDrawer(){
  drawerEl.innerHTML=`<header><h2>Plans</h2>${closeBtn()}</header><p class="muted" style="margin:0">Each plan is its own copy of the schedule. Faculty see only the one you publish.</p>
  <label>Name of this plan<input id="p-name" value="${esc(state.name||'')}"></label>
  <div class="row"><label style="flex:1">New copy named<input id="p-new" placeholder="Plan B"></label><button id="p-copy" style="align-self:flex-end">Copy this plan</button></div>
  <div class="err" id="p-err"></div>
  ${Object.keys(plans).length>1?(ui.confirm==='plan'?`<div class="row"><span class="muted">Delete "${esc(state.name)}"?</span><button class="danger" id="p-del2">Delete</button><button id="p-keep">Keep</button></div>`:`<button class="danger" id="p-del">Delete this plan</button>`):''}`;
  $('#p-name').onchange=e=>commit(st=>{st.name=e.target.value||'Untitled plan'});
  $('#p-copy').onclick=async()=>{const n=$('#p-new').value.trim();if(!n){$('#p-err').textContent='Enter a name for the new copy.';return}
    const id='p'+Date.now().toString(36),body={state:Object.assign(JSON.parse(JSON.stringify(state)),{name:n}),updatedAt:new Date().toISOString(),updatedBy:clientId};
    try{await db.doc('drafts/'+id).set(body);plans[id]=body;switchPlan(id);closeDrawer();toast(`Now editing ${n}.`)}catch(e){$('#p-err').textContent="Couldn't create the copy. Try again shortly."}};
  const d=$('#p-del');if(d)d.onclick=()=>{ui.confirm='plan';renderDrawer()};const k=$('#p-keep');if(k)k.onclick=()=>{ui.confirm=null;renderDrawer()};
  const d2=$('#p-del2');if(d2)d2.onclick=async()=>{const gone=planId;try{await db.doc('drafts/'+gone).delete();delete plans[gone];switchPlan(Object.keys(plans)[0]);closeDrawer();toast('Plan deleted.')}catch(e){toast("Couldn't delete the plan.")}};
}
function publishDrawer(){
  const f=analyze(state,'fall').issues,s=analyze(state,'spring').issues,cnt=(a,l)=>a.filter(i=>i.level===l).length;
  const clash=cnt(f,'clash')+cnt(s,'clash'),check=cnt(f,'check')+cnt(s,'check'),load=cnt(f,'load')+cnt(s,'load');
  drawerEl.innerHTML=`<header><h2>Publish to faculty</h2>${closeBtn()}</header><p style="margin:0">Faculty will see <strong>${esc(state.name)}</strong> as soon as you publish, and your draft stays separate until you publish again.</p>
  <p class="muted" style="margin:0">Still open in this plan: ${clash} overlaps, ${check} items to check, ${load} loads off target. Publishing doesn't change any of these. Workbook questions and load targets are left out of what faculty see.</p>
  <div class="row"><button class="primary" id="pub-go">Publish</button><button data-close>Cancel</button></div>`;
  $('#pub-go').onclick=async()=>{const body={schedule:forFaculty(state),publishedAt:new Date().toISOString()};
    try{await db.doc('published/current').set(body);closeDrawer();toast('Published. Faculty pages update on their own.')}catch(e){toast("Couldn't publish. Try again shortly.")}};
}
function switchPlan(id){if(dirty){clearTimeout(saveTimer);flush()}planId=id;state=JSON.parse(JSON.stringify(plans[id].state));undo=[];redo=[];store.set('plan',id);renderMain();if(ui.drawer)closeDrawer()}

/* A standalone copy of the published schedule for a public web host. It holds only faculty-safe data. */
async function downloadFacultyPage(){
  if(!published||!publishedMeta){toast('Publish to faculty first. The download uses the published version.');return}
  try{
    const bytes=Uint8Array.from(atob($('#fp').textContent.trim()),c=>c.charCodeAt(0));
    const src=JSON.parse(new TextDecoder().decode(bytes));
    const payload=JSON.stringify({schedule:published,publishedAt:publishedMeta.publishedAt}).replace(/</g,'\\u003c');
    const close='</'+'script>';
    const html='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="schedule-published" content="'+esc(publishedMeta.publishedAt)+'"><title>27–28 Academic Map</title>'+src.fonts+'<style>body{margin:0}'+src.css+'</style></head><body><main id="app"></main><aside id="drawer" class="drawer" aria-label="Details" hidden></aside><div id="toast" class="toast" role="status" hidden></div><script>window.__STATIC__='+payload+';'+close+'<script>'+src.js+close+'</body></html>';
    await downloads.save({filename:'index.html',data:html});
    toast('Upload index.html to your web host to update the faculty link.');
  }catch(e){if(!e||e.code!=='declined')toast("Couldn't create the file here.")}
}

async function exportXlsx(){
  if(!window.XLSX){toast("The Excel tool didn't load. Reload the page and try again.");return}
  const st=data(),wb=XLSX.utils.book_new();
  ['fall','spring'].forEach(k=>{const m=st.semesters[k];
    const rows=st.sections.filter(s=>s.sem===k).sort((a,b)=>a.cohort.localeCompare(b.cohort)||DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||byTime(a,b)).map(s=>{const ds=meetingDates(s,m);return{Cohort:(st.cohorts.find(c=>c.id===s.cohort)||{}).label,Course:s.code,Section:s.sec,Title:s.title,Instructor:insOf(st,s.instructor).name,Day:s.day?DAYNAME[s.day]:'',Start:fmtT(s.start),End:fmtT(s.end),Meets:patText(s),Dates:ds?ds.map(toMD).join(', '):'',Credits:s.credits,Cap:s.cap,Format:s.format,Note:s.note}});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),m.label)});
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  try{await downloads.save({filename:'27-28 Academic Map.xlsx',data:buf})}catch(e){if(e&&e.code!=='declined')toast("Couldn't save the file here.")}
}

/* Boot */
if(window.__STATIC__){
  db={};loaded=true;mode='view';published=window.__STATIC__.schedule;publishedMeta={publishedAt:window.__STATIC__.publishedAt};renderMain();
  const stamp=window.__STATIC__.publishedAt;
  setInterval(async()=>{try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/name="schedule-published" content="([^"]+)"/);if(m&&m[1]!==stamp)location.reload()}catch(e){}},window.__POLL_MS__||120000);
  return}
if(!window.claude){db=null;renderMain();return}
renderMain();
const[dbNs,userNs,dlNs]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
db=dbNs;user=userNs;downloads=dlNs;
canEdit=user?await user.canEdit():false;
if(!db){renderMain();return}
mode=canEdit?'edit':'view';
renderMain();
const loadTimer=setTimeout(()=>{slow=true;if(!loaded)renderMain()},10000);
const done=()=>{clearTimeout(loadTimer);loaded=true};
const fail=()=>{clearTimeout(loadTimer);dbError=true;renderMain()};
db.doc('published/current').onSnapshot(sn=>{
  const d=sn.exists?sn.data():null;published=d?JSON.parse(JSON.stringify(d.schedule)):null;publishedMeta=d?{publishedAt:d.publishedAt}:null;
  if(!canEdit){if(!sn.metadata.fromCache||d)done();if(ui.drawer==='section'&&published&&!published.sections.some(s=>s.id===ui.sel))closeDrawer();renderMain();if(ui.drawer)renderDrawer()}
  else if(mode==='view'){renderMain()}else renderStatus();
},fail);
if(canEdit){
  db.collection('drafts').onSnapshot(sn=>{
    sn.docs.forEach(x=>{const b=JSON.parse(JSON.stringify(x.data()));if(x.id===planId&&(b.updatedBy===clientId||dirty))return;plans[x.id]=b;if(x.id===planId&&mode==='edit'){state=JSON.parse(JSON.stringify(b.state));undo=[];redo=[]}});
    Object.keys(plans).forEach(id=>{if(!sn.docs.some(x=>x.id===id)&&!sn.metadata.fromCache&&!sn.metadata.hasPendingWrites)delete plans[id]});
    if(!planId||!plans[planId]){const saved=store.get('plan');planId=plans[saved]?saved:Object.keys(plans)[0]||null;state=planId?JSON.parse(JSON.stringify(plans[planId].state)):null}
    if(!sn.metadata.fromCache||sn.size)done();
    if(!(ui.drawer&&document.activeElement&&drawerEl.contains(document.activeElement)))renderMain();
  },fail);
}
})();
</script></body></html>
